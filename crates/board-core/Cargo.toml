[package]
name = "board-core"
description = "OpenBoard core: PTY sessions, agent launch specs, status tracking, hook bridge, workspace persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio.workspace = true
axum.workspace = true
portable-pty.workspace = true
parking_lot.workspace = true
which.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows: system TLS (schannel) — no C toolchain needed
ureq = { workspace = true, features = ["native-tls"] }
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
