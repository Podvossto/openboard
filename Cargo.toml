[workspace]
resolver = "2"
members = ["crates/board-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
ureq = { version = "3", default-features = false, features = ["json"] }
portable-pty = "0.9"
parking_lot = "0.12"
which = "7"
tempfile = "3"
keyring = { version = "3" }
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
