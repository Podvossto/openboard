name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Install Windows native npm packages
        run: ./scripts/ci-win-native-deps.ps1
      - name: Check tag matches app version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME != app version v$v"; exit 1; fi
      - run: npx tauri build --bundles nsis
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
