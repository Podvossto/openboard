# Linux jobs run on GitLab SaaS shared runners.
# Windows jobs use GitLab-hosted Windows runners (saas-windows-medium-amd64).
stages: [check, test, build]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

.rust-linux:
  image: rust:1-bookworm
  cache:
    key: cargo-linux
    paths: [.cargo/registry, .cargo/git, target]

frontend:
  stage: check
  image: node:24-bookworm
  cache:
    key: npm
    paths: [.npm]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run build

core-lint:
  extends: .rust-linux
  stage: check
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy -p board-core --all-targets -- -D warnings

core-test-linux:
  extends: .rust-linux
  stage: test
  script:
    - cargo test -p board-core

# Real ConPTY coverage — the target platform.
core-test-windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - cargo test -p board-core

windows-installer:
  stage: build
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - choco install nodejs-lts -y --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
    - npm ci
    - npx tauri build
  artifacts:
    expire_in: 30 days
    paths:
      - target/release/bundle/nsis/*.exe
      - target/release/bundle/msi/*.msi
