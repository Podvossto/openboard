# CI runs on our self-hosted runner "hermes-server-ab" (tag: hermes-linux, user-mode docker).
# GitLab SaaS minutes are exhausted, so every job runs on this server with zero quota burn.
# Windows installer is cross-compiled on Linux using cargo-xwin + NSIS in the ab-xwin image.
stages: [check, test, build]

default:
  tags: [hermes-linux]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

.rust-linux:
  image: rust:1-bookworm
  cache:
    key: cargo-linux
    paths: [.cargo/registry, .cargo/git, target]

frontend:
  stage: check
  image: node:24-bookworm
  cache:
    key: npm
    paths: [.npm]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run build

core-lint:
  extends: .rust-linux
  stage: check
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy -p board-core --all-targets -- -D warnings

core-test-linux:
  extends: .rust-linux
  stage: test
  script:
    - cargo test -p board-core

# Windows-target clippy check of the entire workspace (incl. src-tauri)
windows-clippy:
  stage: test
  image: ab-xwin:latest
  cache:
    key: cargo-xwin
    paths: [.cargo/registry, .cargo/git, target]
  script:
    - cargo xwin clippy -p board-core -p agent-board --all-targets --target x86_64-pc-windows-msvc -- -D warnings

# Cross-compiled Windows NSIS installer
windows-installer:
  stage: build
  image: ab-xwin:latest
  needs: [frontend, core-test-linux, windows-clippy]
  cache:
    key: cargo-xwin
    paths: [.cargo/registry, .cargo/git, target]
  script:
    - npm ci --cache .npm --prefer-offline
    - npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
    - mkdir -p dist-win
    - cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-win/
    - ls -lh dist-win/
    - file dist-win/*.exe
    - sha256sum dist-win/*.exe
  rules:
    - if: $CI_COMMIT_TAG == null
  artifacts:
    name: "agent-board-windows-installer-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist-win/*.exe

# Release (tag vX.Y.Z): signed NSIS installer + latest.json → /releases (host dir
# ~/agent-board-releases mounted into the runner; served on private network :8740 for the in-app updater).
# Needs protected+masked CI variables TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) and protected tags v*.
windows-release:
  stage: build
  image: ab-xwin:latest
  needs: [frontend, core-test-linux, windows-clippy]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: cargo-xwin
    paths: [.cargo/registry, .cargo/git, target]
  variables:
    UPDATE_BASE_URL: http://updates.example.invalid:8740/agent-board
  script:
    - test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY not set"; exit 1; }
    - test -d /releases || { echo "/releases not mounted on this runner"; exit 1; }
    - VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
    - test "v$VERSION" = "$CI_COMMIT_TAG" || { echo "tag $CI_COMMIT_TAG != app version $VERSION (run scripts/bump-version.py)"; exit 1; }
    - npm ci --cache .npm --prefer-offline
    - npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
    - mkdir -p dist-win
    - cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*_${VERSION}_*-setup.exe* dist-win/
    - git tag -l --format='%(contents)' "$CI_COMMIT_TAG" > dist-win/notes.txt || true
    - python3 scripts/make-latest-json.py dist-win/*-setup.exe "$UPDATE_BASE_URL" dist-win/notes.txt > dist-win/latest.json
    - cat dist-win/latest.json
    # installer first, manifest last (atomic rename) so clients never see a manifest without its file
    - cp dist-win/*-setup.exe dist-win/*-setup.exe.sig /releases/
    - cp dist-win/latest.json /releases/.latest.json.tmp && mv /releases/.latest.json.tmp /releases/latest.json
    - chown "$(stat -c %u:%g /releases)" /releases/* # job runs as root; keep files owned by the host user
    - ls -lh /releases/
  artifacts:
    name: "agent-board-$CI_COMMIT_TAG"
    expire_in: 90 days
    paths:
      - dist-win/

# Legacy Windows SaaS jobs (manual fallback if SaaS minutes are restored)
.windows-saas:
  tags: [saas-windows-medium-amd64]
  when: manual
  allow_failure: true
  cache:
    key: cargo-windows
    paths: [.cargo/registry, .cargo/git, target]
  before_script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --no-modify-path
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"

core-test-windows:
  extends: .windows-saas
  stage: test
  script:
    - cargo test -p board-core
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
