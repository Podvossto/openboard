# Linux jobs run on GitLab SaaS shared runners.
# Windows jobs use GitLab-hosted Windows runners (saas-windows-medium-amd64).
stages: [check, test, build]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

.rust-linux:
  image: rust:1-bookworm
  cache:
    key: cargo-linux
    paths: [.cargo/registry, .cargo/git, target]

frontend:
  stage: check
  image: node:24-bookworm
  cache:
    key: npm
    paths: [.npm]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run build

core-lint:
  extends: .rust-linux
  stage: check
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy -p board-core --all-targets -- -D warnings

core-test-linux:
  extends: .rust-linux
  stage: test
  script:
    - cargo test -p board-core

.windows:
  tags: [saas-windows-medium-amd64]
  cache:
    key: cargo-windows
    paths: [.cargo/registry, .cargo/git, target]
  before_script:
    - if (-not (Test-Path "$env:CARGO_HOME\bin\cargo.exe")) { Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe; .\rustup-init.exe -y --profile minimal --no-modify-path }
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - cargo --version

# Real ConPTY coverage — the target platform.
core-test-windows:
  extends: .windows
  stage: test
  script:
    - cargo test -p board-core
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

windows-installer:
  extends: .windows
  stage: build
  needs: [frontend, core-test-windows]
  script:
    - if (-not (Get-Command node -ErrorAction SilentlyContinue)) { choco install nodejs-lts -y --no-progress; $env:Path = "C:\Program Files\nodejs;$env:Path" }
    - node --version
    - npm ci
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npx tauri build
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    expire_in: 30 days
    paths:
      - target/release/bundle/nsis/*.exe
      - target/release/bundle/msi/*.msi
